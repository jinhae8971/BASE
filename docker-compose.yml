services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: mais:latest
    container_name: mais-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      MAIS_TZ: Asia/Seoul
      TZ: Asia/Seoul
      PYTHONPATH: /app/src
    volumes:
      - ./data_store:/app/data_store
      - ./config:/app/config
      - ./.kis_token.json:/app/.kis_token.json
    command: ["python", "-m", "scheduler.scheduler"]

  dashboard:
    image: mais:latest
    container_name: mais-dashboard
    restart: unless-stopped
    depends_on:
      - scheduler
    env_file: .env
    environment:
      MAIS_TZ: Asia/Seoul
      TZ: Asia/Seoul
      PYTHONPATH: /app/src
    volumes:
      - ./data_store:/app/data_store
      - ./config:/app/config
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

  daily:
    image: mais:latest
    profiles: ["oneshot"]
    env_file: .env
    environment:
      MAIS_TZ: Asia/Seoul
      TZ: Asia/Seoul
      PYTHONPATH: /app/src
    volumes:
      - ./data_store:/app/data_store
      - ./config:/app/config
    command: ["python", "scripts/run_daily.py", "--env", "paper", "--dry-run"]

  backtest:
    image: mais:latest
    profiles: ["oneshot"]
    env_file: .env
    environment:
      MAIS_TZ: Asia/Seoul
      TZ: Asia/Seoul
      PYTHONPATH: /app/src
    volumes:
      - ./data_store:/app/data_store
      - ./config:/app/config
    command: ["python", "scripts/run_backtest.py"]

  reflect:
    image: mais:latest
    profiles: ["oneshot"]
    env_file: .env
    environment:
      MAIS_TZ: Asia/Seoul
      TZ: Asia/Seoul
      PYTHONPATH: /app/src
    volumes:
      - ./data_store:/app/data_store
      - ./config:/app/config
    command: ["python", "scripts/run_reflection.py"]
