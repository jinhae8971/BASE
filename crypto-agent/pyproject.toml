[project]
name = "crypto-agent"
version = "0.0.1"
description = "Multi-agent cryptocurrency auto-trading system on Claude Agent SDK"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "python-binance>=1.0.19",
    "ccxt>=4.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "qdrant-client>=1.10.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=17.0.0",
    "scipy>=1.13.0",
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "apscheduler>=3.10.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "freezegun>=1.5.0",
]
backtest = [
    "vectorbt>=0.26.0",
    "optuna>=3.6.0",
]

[project.scripts]
crypto-agent = "src.orchestrator.run_daily:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
