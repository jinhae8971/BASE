[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mais"
version = "0.1.0"
description = "Multi-Agent Investment System — Korean equity auto-trading with LLM specialists"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jinhae8971" }]
# Pure-Python core shared by both subsystems. Everything heavy or
# subsystem-specific lives in an extra, so `pip install -e ".[upbit]"` does not
# drag in the Korean-equity data stack (and vice versa).
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Korean equity stack: LLM agents, optimizer, KRX/DART data, RAG memory.
equity = [
    "anthropic>=0.39.0",
    "scipy>=1.12",
    "cvxpy>=1.4",
    "PyPortfolioOpt>=1.5",
    "pykrx>=1.0.45",
    "FinanceDataReader>=0.9.90",
    "OpenDartReader>=0.2.2",
    "chromadb>=0.4.24",
    "sqlalchemy>=2.0",
]
# Upbit crypto day-trading + its dashboard. Installs standalone.
upbit = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
dashboard = [
    "streamlit>=1.33",
    "plotly>=5.20",
]
backtest = [
    "vectorbt>=0.26",
    "matplotlib>=3.8",
]

[project.scripts]
mais-daily = "scheduler.daily_pipeline:main"
mais-backtest = "backtest.engine:main"
mais-reflect = "agents.reflection_agent:main"
mais-upbit = "upbit.cli:main"
mais-upbit-dashboard = "dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dashboard = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
