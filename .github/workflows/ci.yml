name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Exercise the documented install path itself. The `[equity]` extra
          # (cvxpy, chromadb, pykrx, ...) is heavy and native; its integration CI
          # lives in a separate workflow.
          pip install -e ".[upbit,dev]"

      - name: Ruff (Upbit subsystem)
        run: ruff check src/upbit src/dashboard tests/test_upbit_*.py tests/upbit_fakes.py

      - name: Ruff
        run: ruff check src tests
        continue-on-error: true

      - name: Preflight (offline)
        run: mais-upbit doctor --offline

      - name: Pytest
        run: pytest -q
