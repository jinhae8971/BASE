name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "crypto-agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crypto-agent/**"

defaults:
  run:
    working-directory: crypto-agent

jobs:
  lint-and-test:
    name: lint + type + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Source files must be pure ASCII (cp949-safe)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              for skip in ('.git', '.venv', '__pycache__', 'node_modules'):
                  if skip in dirs:
                      dirs.remove(skip)
              for fn in files:
                  if not fn.endswith(('.py', '.bat', '.cmd')):
                      continue
                  p = os.path.join(root, fn)
                  try:
                      open(p, 'rb').read().decode('ascii')
                  except UnicodeDecodeError:
                      bad.append(p)
          if bad:
              print("Non-ASCII characters found in:")
              for p in bad:
                  print(f"  {p}")
              print()
              print("Why this matters: on Korean Windows (the target platform),")
              print("cmd.exe uses cp949 as its default OEM codepage. Non-ASCII")
              print("bytes in .bat files corrupt the parser a few lines later;")
              print("non-ASCII chars in Python print() calls raise")
              print("UnicodeEncodeError when the subprocess writes to stdout.")
              print("Replace em-dashes, curly quotes, emojis, and other")
              print("Unicode punctuation with plain ASCII equivalents.")
              sys.exit(1)
          print("OK: all .py/.bat/.cmd files are pure ASCII")
          PYEOF
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
        continue-on-error: true  # formatting is advisory for now
      - name: Mypy
        run: mypy src || true  # strict mode is a P1 gate
      - name: Pytest
        env:
          TRADING_MODE: dry
        run: pytest -q --tb=short
      - name: Upload coverage (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            crypto-agent/.pytest_cache/
            crypto-agent/htmlcov/
          if-no-files-found: ignore

  docker-build:
    name: docker image build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: crypto-agent
          file: crypto-agent/Dockerfile
          push: false
          tags: crypto-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm \
            -e TRADING_MODE=dry \
            -e ANTHROPIC_API_KEY="" \
            crypto-agent:ci-${{ github.sha }} once --dry-run || true
