name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (core + dev)
        run: |
          python -m pip install --upgrade pip
          # Install a lean subset for CI — heavy native deps (cvxpy, chromadb)
          # are skipped here; integration CI lives in a separate workflow.
          pip install \
            "pydantic>=2.6" "pydantic-settings>=2.2" "pyyaml>=6.0" \
            "python-dotenv>=1.0" "httpx>=0.27" "tenacity>=8.2" \
            "pandas>=2.2" "numpy>=1.26" "structlog>=24.1" "typer>=0.12" \
            "anthropic>=0.39.0" \
            "pytest>=8.1" "pytest-asyncio>=0.23" "ruff>=0.4"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q
