name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "crypto-agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crypto-agent/**"

defaults:
  run:
    working-directory: crypto-agent

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src || true  # strict mode is a P1 gate
      - name: Test
        env:
          TRADING_MODE: dry
        run: pytest -q
