name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "crypto-agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crypto-agent/**"

defaults:
  run:
    working-directory: crypto-agent

jobs:
  lint-and-test:
    name: lint + type + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Windows batch files must be pure ASCII
        shell: bash
        run: |
          set -e
          bad=$(find . -type f \( -name '*.bat' -o -name '*.cmd' \) -print0 \
                  | xargs -0 -I{} python3 -c "
          import sys
          try:
              open('{}', 'rb').read().decode('ascii')
          except UnicodeDecodeError as e:
              print('{}')
              sys.exit(1)
          " || true)
          if [ -n "$bad" ]; then
            echo "Non-ASCII character found in:"
            echo "$bad"
            echo "cmd.exe's default OEM codepage (cp949 on Korean Windows)"
            echo "will mis-parse non-ASCII bytes and break the script. Replace"
            echo "em-dashes, curly quotes, and other Unicode punctuation with"
            echo "plain ASCII equivalents."
            exit 1
          fi
          echo "OK: all .bat/.cmd files are pure ASCII"
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
        continue-on-error: true  # formatting is advisory for now
      - name: Mypy
        run: mypy src || true  # strict mode is a P1 gate
      - name: Pytest
        env:
          TRADING_MODE: dry
        run: pytest -q --tb=short
      - name: Upload coverage (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            crypto-agent/.pytest_cache/
            crypto-agent/htmlcov/
          if-no-files-found: ignore

  docker-build:
    name: docker image build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: crypto-agent
          file: crypto-agent/Dockerfile
          push: false
          tags: crypto-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm \
            -e TRADING_MODE=dry \
            -e ANTHROPIC_API_KEY="" \
            crypto-agent:ci-${{ github.sha }} once --dry-run || true
