# ============================================================
# MAIS Global Settings
# ============================================================

system:
  timezone: Asia/Seoul
  benchmark: KOSPI
  base_currency: KRW

universe:
  index: KOSPI200      # KOSPI200 | KRX300 | ALL
  min_market_cap: 300_000_000_000
  min_adv_20d: 3_000_000_000
  exclude_kosdaq_venture: true
  exclude_administrative: true

risk:
  max_position_weight: 0.10
  max_sector_weight: 0.30
  max_portfolio_mdd: 0.15
  daily_loss_kill: 0.03
  max_turnover_daily: 0.30
  rebalance_threshold: 0.05         # legacy fallback
  cash_buffer_min: 0.05
  # Graduated MDD trim — tiers paired with [25%, 50%, 75%] trim
  graduated_mdd: [0.10, 0.12, 0.15]
  # Per-name asymmetric stops (long-only, "let winners run")
  hard_stop_pct: 0.12               # cut losers fast
  trailing_take_pct: 0.10           # take profit after a 10% pullback from peak
  trailing_min_profit: 0.05         # only trail once +5% from entry

broker:
  # KIS public API caps: paper ~20 req/s, live retail ~5 req/s. We target
  # well below the cap to leave headroom for retries.
  rate_limit_per_sec: 5.0
  rate_limit_burst: 10

websocket:
  # Realtime tick-driven stops via KIS H0STCNT0. Off by default — enable
  # only after the daily pipeline has been stable for at least a week.
  enabled: false
  # Trigger intraday_stops_phase when any position moves more than this
  # fraction since the last reference price.
  tick_threshold: 0.015
  # Suppress repeated firings on the same ticker within this many seconds.
  cooldown_seconds: 60

execution:
  order_style: limit              # limit | market | twap
  twap_enabled: true
  twap_slices: 4
  twap_interval_seconds: 300      # 5 min between slices when TWAP is active
  slippage_bps: 15
  commission_bps: 1.5
  tax_sell_bps: 23
  dry_run_default: true
  limit_offset_bps: 30            # used when no live bid/ask is available
  max_pct_of_adv: 0.10            # cap any single-day order at 10% of 20d ADV
  # Asymmetric drift — quick to add, slow to trim (let winners run)
  rebalance_buy_threshold: 0.04
  rebalance_sell_threshold: 0.08
  # ε-greedy bandit picks the best TWAP interval per day from these arms.
  # Off by default — turn on after twap_enabled has been stable for ≥1w.
  twap_bandit_enabled: false
  twap_bandit_epsilon: 0.10
  twap_bandit_arms: [60, 180, 300, 600]
  # Pyramid winners — add to positions that have proven the thesis
  pyramid_triggers: [0.20, 0.40]   # +20%, +40% from entry
  pyramid_step_pct: 0.025          # add 2.5%p of NAV per level
  # Pre-market shock gate (EWY overnight). action: "skip" | "scale"
  shock_action: "scale"

scheduler:
  research_time: "08:00"
  morning_report_time: "08:30"
  order_time: "09:05"
  monitor_unfilled_time: "09:35"  # cancel+replace stale limits 30 min after order
  eod_review_time: "16:00"
  reflection_day: "friday"
  reflection_time: "18:00"
  heartbeat_time: "08:00"
  jitter_seconds: 60              # +/- random jitter on order_time to avoid HFT pattern
  # Intraday stops — runs every N minutes between start/end on weekdays.
  # Stops-only (never adds or rebalances). Defends capital intraday so we
  # don't have to wait until tomorrow's 09:05 to react to a -8% move.
  intraday_stops_enabled: true
  intraday_stops_start: "10:00"   # KST — after the 09:00 opening volatility
  intraday_stops_end: "15:00"     # KST — before the 15:30 close
  intraday_stops_interval_min: 30

agents:
  macro:
    model: claude-opus-4-6
    temperature: 0.2
    max_tokens: 4000
  sector:
    model: claude-opus-4-6
    temperature: 0.2
    max_tokens: 4000
  value:
    model: claude-opus-4-6
    temperature: 0.1
    max_tokens: 4000
  quant:
    model: claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 2000
  execution:
    model: claude-opus-4-6
    temperature: 0.0
    max_tokens: 3000
  reflection:
    model: claude-opus-4-6
    temperature: 0.3
    max_tokens: 8000

consensus:
  # Quant-heavy + momentum bias — bull markets reward sticking with the
  # leaders, and the Quant agent now adapts factor weights to regime.
  weights:
    macro: 0.20
    sector: 0.15
    value: 0.20
    quant: 0.45
  min_conviction: 5
  min_agreement: 2

optimizer:
  # score_weighted | mean_variance | black_litterman
  method: score_weighted
  risk_aversion: 3.0
  lookback_days: 252
  shrinkage: ledoit_wolf
  # A/B paper books: every optimizer is shadow-run + tracked. Set true to
  # auto-rotate to the previous month's Sharpe winner at month-end.
  ab_auto_rotate: false

memory:
  journal_db: data_store/journal.sqlite
  rag_store: data_store/chroma
  rag_top_k: 5

learning:
  # ML-based consensus weight booster. The weekly reflection job appends
  # booster patches to the report; eod_phase auto-applies them through the
  # whitelisted reflection_apply pipeline. Set true to skip reflection and
  # apply directly (rarely needed).
  auto_apply: false
  # Model selector — auto promotes MLP once >=50 labelled picks are
  # available, falls back to ridge below that. Set explicit to force
  # one path. Values: auto | mlp | ridge.
  model: auto
  mlp_hidden: [16, 8]   # MLPRegressor hidden_layer_sizes

hedge:
  # Defensive spot-ETF hedge — long-only, no futures. Off by default.
  enabled: false
  # Maximum portion of cash that can be redirected into the basket.
  max_hedge_weight: 0.20
  # Don't hedge unless cash already exceeds this (keep some dry powder).
  min_cash_to_hedge: 0.10
  # Spot-only basket. Override per-ticker if you maintain your own.
  basket:
    "411060": {name: "ACE KRX금현물", weight: 0.50, kind: gold_spot}
    "304660": {name: "KOSEF 단기자금", weight: 0.30, kind: money_market}
    "132030": {name: "KODEX 국고채30년", weight: 0.20, kind: long_bond}

notifications:
  # Optional: full dashboard URL appended as a deeplink to every Slack/
  # Telegram message so the operator can jump straight from the alert.
  # Example: "http://192.168.0.10:8501"
  dashboard_url: ""
  # Per-category × per-level toggle. Set false to suppress noisy events
  # (e.g. order-info pings every fill on a busy day).
  categories:
    order:   {info: true,  warning: true, error: true}
    risk:    {info: true,  warning: true, error: true}
    agent:   {info: false, warning: true, error: true}
    booster: {info: false, warning: true, error: true}
    general: {info: true,  warning: true, error: true}
  # Digest mode: queue info-level events to a JSONL buffer and flush as a
  # single summary on a cron. Useful during heavy backfill periods.
  digest:
    enabled: false
    interval_seconds: 3600     # cron flushes every hour
  # Drop messages of the same (category,level) beyond this within the window.
  rate_limit:
    max_per_window: 10
    window_seconds: 600

monitor:
  # Paper-vs-live divergence: alert when the two NAV curves drift apart by
  # this fraction of return (default 0.5%). 0 disables the check.
  divergence_threshold: 0.005
  # Prometheus exporter port (scheduler container). Map this in
  # docker-compose if you want host-level scraping.
  metrics_port: 9100

backtest:
  start: "2015-01-01"
  initial_capital: 100_000_000
  benchmark_ticker: "^KS11"
